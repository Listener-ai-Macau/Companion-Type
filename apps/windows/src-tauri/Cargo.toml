[package]
name = "companion-type"
version = "0.1.0"
description = "Standalone Companion Type host app"
authors = ["Listener AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "companion_type_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

