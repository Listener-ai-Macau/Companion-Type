[package]
name = "companion-mobile-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
crc32fast = "1"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
