[package]
name = "companion-mobile-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
mobile-asr = ["dep:futures", "dep:serde_json", "dep:tokio", "dep:tokio-tungstenite", "dep:uuid", "dep:rustls"]
mobile-local-asr = ["mobile-asr", "dep:libloading"]
mobile-calendar = ["dep:chrono", "dep:regex", "dep:serde_json"]
mobile-memo = ["dep:regex", "dep:serde_json", "dep:companion-meeting-transcript"]
mobile-minutes = ["mobile-memo", "dep:reqwest", "dep:uuid", "dep:chrono"]
mobile-control = ["mobile-minutes", "mobile-documents"]
mobile-documents = ["dep:serde_json", "dep:zip", "dep:chrono"]

[dependencies]
companion-meeting-transcript = { path = "../../../packages/meeting-transcript", optional = true }
crc32fast = "1"
zip = { version = "4.6.1", default-features = false, optional = true }
jni = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
libloading = { version = "0.8", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
futures = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"], optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
