plugins { id 'com.android.application' }

android {
    namespace 'com.denzic.companion.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.denzic.companion.app'
        minSdk 26
        targetSdk 35
        versionCode 152
        versionName '0.1.152'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/companionAssets').get().asFile
    buildTypes { release { minifyEnabled false } }
}

tasks.register('copyCompanionWeb', Sync) {
    from('../../mobile/dist')
    into(layout.buildDirectory.dir('generated/companionAssets/www'))
}
// Reject a stale/incomplete AAR before Java compilation or packaging. The
// current backend source is a separately frozen workspace named by this receipt.
tasks.register('verifyCompanionBackend') {
    def backendFile = layout.projectDirectory.file('libs/companion-android-backend.aar')
    def receiptFile = layout.projectDirectory.file('libs/companion-android-backend.provenance.json')
    inputs.files(backendFile, receiptFile)
    doLast {
        def receipt = new groovy.json.JsonSlurper().parse(receiptFile.asFile)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        backendFile.asFile.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != receipt.aarSha256 ||
            !(receipt.backendSourceCommit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('Android backend differs from its verified complete source receipt. Rebuild that backend and refresh the receipt; do not package the legacy workspace AAR.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('copyCompanionWeb', 'verifyCompanionBackend') }
dependencies { implementation files('libs/companion-android-backend.aar') }

// First-run local transcription also needs these Java classpath resources.
// The frozen native AAR omitted them; keep the publisher-derived bytes pinned.
tasks.register('verifyCompanionModelResources') {
    def resourceDirectory = layout.projectDirectory.dir('src/main/resources/com/denzic/companion/mobile')
    inputs.dir(resourceDirectory)
    doLast {
        def receipt = new groovy.json.JsonSlurper().parse(resourceDirectory.file('provenance.json').asFile)
        receipt.resources.each { resource ->
            def file = resourceDirectory.file(resource.name).asFile
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
            if (file.length() != resource.bytes || actual != resource.sha256) {
                throw new GradleException('Pinned first-run model resource is missing or changed: ' + resource.name + ' bytes=' + file.length() + ' sha256=' + actual)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyCompanionModelResources') }
