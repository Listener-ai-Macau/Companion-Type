name: Windows candidate

on:
  push:
    branches: [work/device-phone-closure055-20261106]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-ui:
    if: contains(github.event.head_commit.message, '[core-ui]')
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - run: npm ci --no-audit --no-fund
      - name: Check the grouped meeting UI changes
        run: node tools/qa/core_acceptance20261109/ui_source.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: companion-core-ui-${{ github.sha }}
          path: core-ui-output/
          retention-days: 7
          if-no-files-found: warn
  core-audio:
    if: contains(github.event.head_commit.message, '[core-audio]')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      # GitHub restricts private draft assets to repository push access.
      # This job only downloads the frozen public test input; it never publishes.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Run the real public audio import, playback and delivery workflow
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_CORE_PHASE: audio
        run: python tools/qa/core_acceptance20261109/run_ci.py
      - name: Preserve audio workflow results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-core-audio-${{ github.sha }}
          path: core-ci-output/
          retention-days: 7
          if-no-files-found: warn
  core-acceptance:
    if: contains(github.event.head_commit.message, '[core-acceptance]')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Run the frozen app's continuous Windows software workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/core_acceptance20261109/run_ci.py
      - name: Preserve full workflow results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-core-acceptance-${{ github.sha }}
          path: core-ci-output/
          retention-days: 7
          if-no-files-found: warn
  candidate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]')
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Install matching Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Build frozen candidate and installer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/companion-windows-target
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_windows_candidate_ci.py
      - name: Preserve candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-windows-candidate-${{ github.sha }}
          path: ci-output/
          retention-days: 7
          if-no-files-found: warn
