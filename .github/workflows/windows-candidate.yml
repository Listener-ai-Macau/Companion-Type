name: Windows candidate

on:
  push:
    branches: [work/device-phone-closure055-20261106]
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate or verify an existing matched candidate
        type: choice
        options: [candidate, context, editing]
        default: candidate
      candidate_spec:
        description: Repository path to the independently inspected candidate spec
        type: string
        default: docs/handoffs/android-media-import20261110/windows083/runtime-spec.json

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[windows-build]') || contains(github.event.head_commit.message, '[windows-bundle]') || inputs.operation == 'candidate') && 'build' || (contains(github.event.head_commit.message, '[core-documents]') || contains(github.event.head_commit.message, '[core-context]') || contains(github.event.head_commit.message, '[core-audio-edit]') || inputs.operation == 'context' || inputs.operation == 'editing') && 'runtime' || github.run_id }}
  cancel-in-progress: false

jobs:
  paired-product-asr:
    if: contains(github.event.head_commit.message, '[paired-product-asr]')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check psutil==7.2.2
      - name: Run declared public inputs through the frozen native product ASR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/paired_real_meeting20261110/run_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired-product-asr-${{ github.sha }}
          path: paired-product-asr-output/
          retention-days: 7
          if-no-files-found: warn
  core-ui:
    if: contains(github.event.head_commit.message, '[core-ui]')
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - run: npm ci --no-audit --no-fund
      - name: Check the grouped meeting UI changes
        run: node tools/qa/core_acceptance20261109/ui_source.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: companion-core-ui-${{ github.sha }}
          path: core-ui-output/
          retention-days: 7
          if-no-files-found: warn
  core-audio:
    if: contains(github.event.head_commit.message, '[core-actions]') || contains(github.event.head_commit.message, '[core-audio]') || contains(github.event.head_commit.message, '[core-candidate]') || contains(github.event.head_commit.message, '[core-whole-meeting]') || contains(github.event.head_commit.message, '[core-whole-delivery]')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      # GitHub restricts private draft assets to repository push access.
      # This job only downloads the frozen public test input; it never publishes.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Run the real public audio import, playback and delivery workflow
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_CORE_PHASE: ${{ contains(github.event.head_commit.message, '[core-actions]') && 'actions' || contains(github.event.head_commit.message, '[core-whole-delivery]') && 'delivery' || contains(github.event.head_commit.message, '[core-whole-meeting]') && 'whole' || 'audio' }}
          COMPANION_ACCEPTANCE_CANDIDATE_SPEC: ${{ contains(github.event.head_commit.message, '[core-actions]') && 'docs/handoffs/actions-followup20261110/windows082/runtime-spec.json' || contains(github.event.head_commit.message, '[core-whole-delivery]') && 'docs/handoffs/core-acceptance-20261109/whole-delivery-spec.json' || contains(github.event.head_commit.message, '[core-whole-meeting]') && 'docs/handoffs/core-acceptance-20261109/whole-meeting-spec.json' || contains(github.event.head_commit.message, '[core-candidate]') && 'docs/handoffs/core-acceptance-20261109/candidate079/runtime-spec.json' || '' }}
        run: python tools/qa/core_acceptance20261109/run_ci.py
      - name: Preserve audio workflow results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-core-audio-${{ github.sha }}
          path: core-ci-output/
          retention-days: 7
          if-no-files-found: warn
  context-acceptance:
    if: contains(github.event.head_commit.message, '[core-context]') || contains(github.event.head_commit.message, '[core-documents]') || contains(github.event.head_commit.message, '[core-audio-edit]') || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'context' || inputs.operation == 'editing'))
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Verify the matched packaged image-note workflow on an isolated runner
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_CORE_PHASE: ${{ (contains(github.event.head_commit.message, '[core-audio-edit]') || inputs.operation == 'editing') && 'editing' || contains(github.event.head_commit.message, '[core-documents]') && 'documents' || 'context' }}
          COMPANION_ACCEPTANCE_CANDIDATE_SPEC: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_spec || contains(github.event.head_commit.message, '[core-audio-edit]') && 'docs/handoffs/android-media-import20261110/windows095/runtime-spec.json' || contains(github.event.head_commit.message, '[core-documents]') && 'docs/handoffs/android-media-import20261110/windows108/runtime-spec.json' || 'docs/handoffs/android-media-import20261110/windows087/runtime-spec.json' }}
        run: python tools/qa/core_acceptance20261109/run_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: companion-context-${{ github.sha }}
          path: core-ci-output/
          retention-days: 7
          if-no-files-found: warn

  core-acceptance:
    if: contains(github.event.head_commit.message, '[core-acceptance]')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Run the frozen app's continuous Windows software workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/qa/core_acceptance20261109/run_ci.py
      - name: Preserve full workflow results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-core-acceptance-${{ github.sha }}
          path: core-ci-output/
          retention-days: 7
          if-no-files-found: warn
  candidate:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate') || contains(github.event.head_commit.message, '[windows-build]') || contains(github.event.head_commit.message, '[windows-bundle]')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Install matching Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Reuse locked Rust dependencies and compiler outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/companion-windows-target
          key: windows2022-rust195-msvc-v1-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows2022-rust195-msvc-v1-${{ hashFiles('**/Cargo.lock') }}-
            windows2022-rust195-msvc-v1-
      - name: Build frozen candidate and installer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/companion-windows-target
          GH_TOKEN: ${{ github.token }}
          COMPANION_REUSE_NATIVE_SPEC: ${{ contains(github.event.head_commit.message, '[windows-bundle]') && 'docs/handoffs/android-media-import20261110/windows100/repackage-spec.json' || '' }}
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_windows_candidate_ci.py
      - name: Preserve candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-windows-candidate-${{ github.sha }}
          path: ci-output/
          retention-days: 7
          if-no-files-found: warn
