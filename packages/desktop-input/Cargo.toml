[package]
name = "companion-desktop-input"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
enigo = "=0.2.1"
arboard = "=3.6.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices"] }
