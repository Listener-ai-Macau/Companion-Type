    {id:'public-idea',title:'散步时的想法 · 文字示例',time:'08:45',duration:'文字',kind:'虚构文字示例',meta:'公开虚构资料 · 没有录音文件',preview:'记录想法时先留下原话，需要整理时再打开。',audio:false,summary:'记录想法时先保存原话，有时间再回看和整理。',tasks:[],pending:'这条笔记没有需要安排的事项。',transcript:['这是一份公开虚构的文字示例。','走路时想到的事情，先简单记下来。有时间再回看，决定哪些需要继续做。']}
  ];
  const widgets=[];
  const saved=globalThis.openai?.widgetState;
  function icons(){globalThis.lucide?.createIcons?.({attrs:{width:17,height:17}});}
  function escape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function persist(widget){
    const value={modelContent:{designDirection:widget.name,selectedRecording:records.find(r=>r.id===widget.selected)?.title,density:widget.options.rowPadding},privateContent:{views:widgets.map(w=>({name:w.name,selected:w.selected,pane:w.pane,favorites:[...w.favorites],options:w.options}))}};
    const request=globalThis.openai?.setWidgetState?.(value);request?.catch?.(()=>{});
  }
  function restore(widget,snapshot){const item=snapshot?.privateContent?.views?.find(view=>view.name===widget.name);if(!item)return;if(records.some(record=>record.id===item.selected))widget.selected=item.selected;if(['minutes','transcript'].includes(item.pane))widget.pane=item.pane;if(Array.isArray(item.favorites))widget.favorites=new Set(item.favorites.filter(id=>records.some(record=>record.id===id)));if(item.options&&Number.isFinite(item.options.rowPadding)&&Number.isFinite(item.options.radius))Object.assign(widget.options,{rowPadding:Math.max(10,Math.min(22,item.options.rowPadding)),radius:Math.max(0,Math.min(14,item.options.radius))});}
  function renderBody(widget){
    const record=records.find(row=>row.id===widget.selected);const app=widget.app;
    app.querySelector('.cn-reading-tabs').hidden=false;app.querySelector('.cn-reader-tools').hidden=false;
    app.querySelector('.cn-document-heading h1').textContent=record.title;
    app.querySelector('.cn-eyebrow').textContent=record.kind;
    app.querySelector('.cn-record-meta').textContent=record.meta;
    app.querySelectorAll('[data-pane]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.pane===widget.pane)));
    const body=app.querySelector('.cn-document-body');
    body.setAttribute('role','tabpanel');body.setAttribute('aria-labelledby',app.querySelector('[data-pane="'+widget.pane+'"]').id);body.removeAttribute('aria-label');
    if(widget.pane==='transcript')body.innerHTML='<section class="cn-transcript"><h3>原话</h3>'+record.transcript.map(paragraph=>'<p>'+escape(paragraph)+'</p>').join('')+'</section>';
    else body.innerHTML='<section><h3>重点</h3><p>'+escape(record.summary)+'</p></section><section><h3>接下来做什么</h3>'+(record.tasks.length?'<div class="cn-tasks">'+record.tasks.map((task,index)=>'<label class="cn-task"><input type="checkbox" data-task="'+index+'" '+(widget.completed.has(record.id+':'+index)?'checked':'')+'/><span><span>'+escape(task.text)+'</span><small>'+escape(task.owner)+' · '+escape(task.due)+'</small></span></label>').join('')+'</div>':'<p>这条笔记没有安排待办。</p>')+'</section><section><h3>待确认</h3><p class="cn-pending">'+escape(record.pending)+'</p></section>';
    body.querySelectorAll('[data-task]').forEach(box=>{box.closest('label').classList.toggle('is-done',box.checked);box.addEventListener('change',()=>{const key=record.id+':'+box.dataset.task;box.checked?widget.completed.add(key):widget.completed.delete(key);box.closest('label').classList.toggle('is-done',box.checked);persist(widget);});});
    app.querySelector('[data-action=favorite]').setAttribute('aria-pressed',String(widget.favorites.has(record.id)));
    app.querySelector('[data-action=favorite]').setAttribute('aria-label',widget.favorites.has(record.id)?'取消收藏这条录音':'收藏这条录音');
    const player=app.querySelector('.cn-player');player.hidden=!record.audio;app.querySelector('.cn-export').hidden=true;
    app.querySelector('.cn-notice').textContent=record.audio?'':'这条公开文字示例没有原音文件。';
    app.querySelectorAll('.cn-record').forEach(button=>button.setAttribute('aria-current',String(button.dataset.record===record.id)));
    icons();
  }
  function renderList(widget){
    const query=widget.app.querySelector('input[type=search]').value.trim().toLowerCase();let count=0;
    widget.app.querySelectorAll('.cn-record').forEach(button=>{const record=records.find(row=>row.id===button.dataset.record);const visible=(widget.folder==='all'||widget.favorites.has(record.id))&&[record.title,record.summary,...record.transcript].join(' ').toLowerCase().includes(query);button.hidden=!visible;if(visible)count++;});
    widget.app.querySelector('.cn-no-results').hidden=count>0;
    widget.app.querySelectorAll('[data-folder]').forEach(button=>button.setAttribute('aria-current',button.dataset.folder===widget.folder?'page':'false'));
  }
  function options(widget){widget.app.style.setProperty('--cn-row-pad',widget.options.rowPadding+'px');widget.app.style.setProperty('--cn-radius',widget.options.radius+'px');}
  function message(widget,title,html){widget.app.dataset.view='detail';widget.app.querySelector('.cn-document-heading h1').textContent=title;widget.app.querySelector('.cn-eyebrow').textContent='Companion';widget.app.querySelector('.cn-record-meta').textContent='界面草案';const body=widget.app.querySelector('.cn-document-body');body.innerHTML=html;body.setAttribute('role','region');body.setAttribute('aria-label',title);body.removeAttribute('aria-labelledby');widget.app.querySelector('.cn-reading-tabs').hidden=true;widget.app.querySelector('.cn-reader-tools').hidden=true;widget.app.querySelector('.cn-player').hidden=true;widget.app.querySelector('.cn-export').hidden=true;widget.app.querySelector('.cn-notice').textContent='';}
  for(const app of root.querySelectorAll('.cn-app')){
    const widget={app,name:app.closest('[data-variant]').dataset.variant,selected:'public-voice',pane:'minutes',folder:'all',favorites:new Set(['public-voice']),completed:new Set(),options:{rowPadding:17,radius:9}};widgets.push(widget);restore(widget,saved);
    const prefix='companion-design-'+widgets.length;app.querySelector('.cn-document-body').id=prefix+'-content';app.querySelectorAll('[data-pane]').forEach(button=>{button.id=prefix+'-'+button.dataset.pane;button.setAttribute('aria-controls',prefix+'-content');button.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=[...app.querySelectorAll('[data-pane]')];const index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(tabs.indexOf(button)+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[index].click();tabs[index].focus();}});});app.querySelectorAll('.cn-rail button').forEach(button=>button.setAttribute('aria-label',button.textContent.replace('未连接','').trim()));
    app.querySelector('.cn-records').innerHTML=records.map(record=>'<button type="button" class="cn-record" data-record="'+record.id+'" aria-current="false" data-tooltip="'+escape(record.title)+'"><div class="cn-record-meta-line"><strong>'+escape(record.title)+'</strong></div><small>'+record.time+' · '+record.duration+'</small><p>'+escape(record.preview)+'</p></button>').join('');
    app.querySelector('.cn-wave').innerHTML=peaks.map(value=>'<span style="height:'+Math.round(6+value*21)+'px"></span>').join('');
    app.querySelector('input[type=search]').addEventListener('input',()=>renderList(widget));
    app.querySelectorAll('[data-record]').forEach(button=>button.addEventListener('click',()=>{audio.pause();widget.selected=button.dataset.record;app.dataset.view='detail';renderBody(widget);persist(widget);}));
    app.querySelectorAll('[data-pane]').forEach(button=>button.addEventListener('click',()=>{widget.pane=button.dataset.pane;renderBody(widget);persist(widget);}));
    app.querySelectorAll('[data-folder]').forEach(button=>button.addEventListener('click',()=>{widget.folder=button.dataset.folder;app.dataset.view='library';renderList(widget);renderBody(widget);persist(widget);}));
    app.querySelector('[data-action=favorite]').addEventListener('click',()=>{widget.favorites.has(widget.selected)?widget.favorites.delete(widget.selected):widget.favorites.add(widget.selected);renderBody(widget);renderList(widget);persist(widget);});
    app.querySelector('[data-action=back]').addEventListener('click',()=>{app.dataset.view='library';renderBody(widget);});
    app.querySelector('[data-action=export]').addEventListener('click',()=>{const record=records.find(row=>row.id===widget.selected);const panel=app.querySelector('.cn-export');panel.hidden=!panel.hidden;panel.querySelector('textarea').value=record.title+'\n\n'+(widget.pane==='transcript'?record.transcript.join('\n\n'):record.summary+'\n\n'+record.tasks.map(task=>'□ '+task.text+'（'+task.owner+'，'+task.due+'）').join('\n')+'\n\n待确认：'+record.pending);});
    app.querySelector('[data-action=close-export]').addEventListener('click',()=>app.querySelector('.cn-export').hidden=true);
    app.querySelector('[data-action=play]').addEventListener('click',()=>{if(audio.paused){audio.play().catch(()=>app.querySelector('.cn-notice').textContent='当前浏览器未能播放这段公开示例。');}else audio.pause();persist(widget);});
    app.querySelector('[data-action=device]').addEventListener('click',()=>message(widget,'录音卡','<section><h3>未连接</h3><p>已保存的录音和文字可以继续查看。</p><p style="margin-top:16px;color:var(--cn-muted)">这个界面预览不连接设备，也不开始录音。</p><button type="button" class="cn-button" data-return style="margin-top:24px">返回录音内容</button></section>'));
    app.querySelector('[data-action=settings]').addEventListener('click',()=>{message(widget,'设置','<section><h3>外观</h3><label class="cn-setting-field">界面主题<select aria-label="界面主题"><option value="light dark">跟随当前外观</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button type="button" class="cn-button" data-return style="margin-top:16px">返回录音内容</button></section>');app.querySelector('select').addEventListener('change',event=>app.style.colorScheme=event.target.value);});
    app.querySelector('[data-action=import]').addEventListener('click',()=>message(widget,'导入录音','<section><h3>把已有录音放进资料库</h3><p>正式应用在这里选择已有音频，导入后仍沿用同一套阅读和整理界面。</p><p style="margin-top:16px;color:var(--cn-muted)">这份预览使用下方列表中的公开示例，不读取你的文件。</p><button type="button" class="cn-button" data-return style="margin-top:24px">查看公开示例</button></section>'));
    app.querySelector('.cn-document-body').addEventListener('click',event=>{if(event.target.closest('[data-return]'))renderBody(widget);});
    renderBody(widget);renderList(widget);options(widget);
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{options(widget);persist(widget);}});tweak.addSlider(widget.options,'rowPadding',{label:'列表留白',min:10,max:22,unit:'px',reference:'--cn-row-pad'});tweak.addSlider(widget.options,'radius',{label:'列表圆角',min:0,max:14,unit:'px',reference:'--cn-radius'});}
  }
  function playerState(){const playing=!audio.paused;root.querySelectorAll('[data-action=play]').forEach(button=>{button.setAttribute('aria-label',playing?'暂停公开示例':'播放公开示例');button.innerHTML='<i data-lucide="'+(playing?'pause':'play')+'" aria-hidden="true"></i>';});icons();}
  audio.addEventListener('play',playerState);audio.addEventListener('pause',playerState);audio.addEventListener('ended',playerState);
  audio.addEventListener('timeupdate',()=>{const seconds=Math.floor(audio.currentTime);root.querySelectorAll('.cn-player-time').forEach(time=>time.textContent='0:'+String(seconds).padStart(2,'0')+' / 0:23');root.querySelectorAll('.cn-wave').forEach(wave=>[...wave.children].forEach((bar,index)=>bar.classList.toggle('cn-heard',index/peaks.length<audio.currentTime/23.2245)));});
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(!snapshot)return;widgets.forEach(widget=>{restore(widget,snapshot);renderBody(widget);renderList(widget);options(widget);});});
})();
</script>
